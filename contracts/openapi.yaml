openapi: 3.1.0
info:
  title: YouTube Stream Analyzer API
  version: 0.2.0
  description: M1配信登録とM2ライブチャット収集・閲覧のHTTP契約
servers:
  - url: /api
paths:
  /streams/preview:
    post:
      operationId: previewStream
      summary: YouTube配信情報を確認する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamUrlRequest' }
      responses:
        '200':
          description: プレビュー成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamMetadata' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /streams:
    post:
      operationId: registerStream
      summary: 終了済み配信を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamUrlRequest' }
      responses:
        '200':
          description: 登録済みStreamを返却
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '201':
          description: Streamを新規登録
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listStreams
      summary: 登録済み配信を一覧取得する
      responses:
        '200':
          description: 登録日時降順の一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamList' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}:
    get:
      operationId: getStream
      summary: 登録済み配信の詳細を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: Stream詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-collections:
    post:
      operationId: startChatCollection
      summary: ライブチャット収集ジョブを開始する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '201':
          description: ジョブを作成
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-collections/latest:
    get:
      operationId: getLatestChatCollection
      summary: 最新のライブチャット収集状態を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: 最新ジョブ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /collection-jobs/{jobId}/retry:
    post:
      operationId: retryCollectionJob
      summary: 失敗した収集ジョブを再実行する
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '201':
          description: 新しいattemptのジョブを作成
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-messages:
    get:
      operationId: listChatMessages
      summary: 収集済みチャットを経過時刻順に取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: チャットページ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    StreamId:
      name: streamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    StreamUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    StreamMetadata:
      type: object
      required: [youtubeVideoId, title, channelId, channelTitle, thumbnailUrl, actualStartAt, actualEndAt, durationSeconds]
      properties:
        youtubeVideoId: { type: string, minLength: 11, maxLength: 11 }
        title: { type: string }
        channelId: { type: string }
        channelTitle: { type: string }
        thumbnailUrl: { type: string, format: uri }
        scheduledStartAt: { type: [string, 'null'], format: date-time }
        actualStartAt: { type: string, format: date-time }
        actualEndAt: { type: string, format: date-time }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
        publishedAt: { type: [string, 'null'], format: date-time }
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamMetadata'
        - type: object
          required: [id, sourceUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            sourceUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StreamList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Stream' }
        total: { type: integer, minimum: 0 }
    CollectionJob:
      type: object
      required: [id, streamId, kind, status, attempt, processedCount, requestedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        streamId: { type: string, format: uuid }
        kind: { type: string, enum: [chat_replay] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        attempt: { type: integer, minimum: 1 }
        currentStep: { type: [string, 'null'], enum: [fetch_chat, null] }
        processedCount: { type: integer, format: int64, minimum: 0 }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - $ref: '#/components/schemas/CollectionError'
            - type: 'null'
    CollectionError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    ChatMessage:
      type: object
      required: [id, externalMessageId, authorDisplayName, messageText, publishedAt, offsetMilliseconds, messageType]
      properties:
        id: { type: string, format: uuid }
        externalMessageId: { type: string }
        authorChannelId: { type: [string, 'null'] }
        authorDisplayName: { type: string }
        messageText: { type: string }
        publishedAt: { type: string, format: date-time }
        offsetMilliseconds: { type: integer, format: int64 }
        messageType: { type: string, enum: [text] }
    ChatMessagePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - INVALID_YOUTUBE_URL
            - YOUTUBE_VIDEO_NOT_FOUND
            - NOT_ENDED_LIVE_STREAM
            - YOUTUBE_ACCESS_DENIED
            - YOUTUBE_QUOTA_EXCEEDED
            - YOUTUBE_TEMPORARILY_UNAVAILABLE
            - STREAM_NOT_FOUND
            - COLLECTION_ALREADY_ACTIVE
            - COLLECTION_JOB_NOT_FOUND
            - COLLECTION_JOB_NOT_RETRYABLE
            - CHAT_COLLECTION_NOT_COMPLETED
            - CHAT_REPLAY_UNAVAILABLE
            - CHAT_SOURCE_CHANGED
            - CHAT_SOURCE_TEMPORARILY_UNAVAILABLE
            - INTERNAL_ERROR
