openapi: 3.1.0
info:
  title: YouTube Stream Analyzer API
  version: 0.3.0
  description: M1配信登録、M2チャット収集、M3複数工程収集・字幕・同期閲覧・検索のHTTP契約
servers:
  - url: /api
paths:
  /streams/preview:
    post:
      operationId: previewStream
      summary: YouTube配信情報を確認する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamUrlRequest' }
      responses:
        '200':
          description: プレビュー成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamMetadata' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /streams:
    post:
      operationId: registerStream
      summary: 終了済み配信を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamUrlRequest' }
      responses:
        '200':
          description: 登録済みStreamを返却
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '201':
          description: Streamを新規登録
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listStreams
      summary: 登録済み配信を一覧取得する
      responses:
        '200':
          description: 登録日時降順の一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamList' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}:
    get:
      operationId: getStream
      summary: 登録済み配信の詳細を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: Stream詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/collections:
    post:
      operationId: startCollection
      summary: M3標準工程の配信データ収集を開始する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCollectionRequest' }
      responses:
        '201':
          description: 複数工程の収集Jobを作成
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/collections/latest:
    get:
      operationId: getLatestCollection
      summary: 最新の複数工程収集状態を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: 最新Jobと全Step状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /collection-jobs/{jobId}/steps/{stepName}/retry:
    post:
      operationId: retryCollectionStep
      summary: 失敗した工程だけを再実行する
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/StepName'
      responses:
        '201':
          description: 新しい工程attemptを作成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionStep' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-collections:
    post:
      deprecated: true
      operationId: startChatCollection
      summary: M2互換のライブチャット収集ジョブを開始する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '201':
          description: チャット工程だけを持つJobを作成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-collections/latest:
    get:
      deprecated: true
      operationId: getLatestChatCollection
      summary: M2互換の最新チャット収集状態を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: 最新チャットJob
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /collection-jobs/{jobId}/retry:
    post:
      deprecated: true
      operationId: retryCollectionJob
      summary: M2互換の単一工程Jobを再実行する
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '201':
          description: 新しいJob attemptを作成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionJob' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/chat-messages:
    get:
      operationId: listChatMessages
      summary: 収集済みチャットを経過時刻順に取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: チャットページ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/transcript-segments:
    get:
      operationId: listTranscriptSegments
      summary: 字幕セグメントを経過時刻順に取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: fromMs
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: toMs
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 字幕ページ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptSegmentPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/timeline:
    get:
      operationId: getTimelineWindow
      summary: 指定動画時刻範囲のチャットと字幕を取得する
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: fromMs
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: toMs
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: types
          in: query
          schema:
            type: array
            items: { type: string, enum: [chat, transcript] }
            default: [chat, transcript]
          style: form
          explode: false
      responses:
        '200':
          description: 同期タイムライン範囲
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineWindow' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /streams/{streamId}/search:
    get:
      operationId: searchStreamData
      summary: チャットと字幕を文字列検索する
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: types
          in: query
          schema:
            type: array
            items: { type: string, enum: [chat, transcript] }
            default: [chat, transcript]
          style: form
          explode: false
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 統一検索結果ページ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamSearchPage' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    StreamId:
      name: streamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepName:
      name: stepName
      in: path
      required: true
      schema: { type: string, enum: [metadata, chat_replay, transcript] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    StreamUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    StreamMetadata:
      type: object
      required: [youtubeVideoId, title, channelId, channelTitle, thumbnailUrl, actualStartAt, actualEndAt, durationSeconds]
      properties:
        youtubeVideoId: { type: string, minLength: 11, maxLength: 11 }
        title: { type: string }
        channelId: { type: string }
        channelTitle: { type: string }
        thumbnailUrl: { type: string, format: uri }
        scheduledStartAt: { type: [string, 'null'], format: date-time }
        actualStartAt: { type: string, format: date-time }
        actualEndAt: { type: string, format: date-time }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
        publishedAt: { type: [string, 'null'], format: date-time }
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamMetadata'
        - type: object
          required: [id, sourceUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            sourceUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StreamList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Stream' }
        total: { type: integer, minimum: 0 }
    StartCollectionRequest:
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          uniqueItems: true
          default: [metadata, chat_replay, transcript]
          items: { type: string, enum: [metadata, chat_replay, transcript] }
    CollectionJob:
      type: object
      required: [id, streamId, status, requestedSteps, progressCount, requestedAt, updatedAt, steps]
      properties:
        id: { type: string, format: uuid }
        streamId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, partial, failed, cancelled] }
        requestedSteps:
          type: array
          items: { type: string, enum: [metadata, chat_replay, transcript] }
        progressCount: { type: integer, format: int64, minimum: 0 }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - $ref: '#/components/schemas/CollectionError'
            - type: 'null'
        steps:
          type: array
          items: { $ref: '#/components/schemas/CollectionStep' }
    CollectionStep:
      type: object
      required: [id, jobId, name, status, attempt, progressCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        name: { type: string, enum: [metadata, chat_replay, transcript] }
        status: { type: string, enum: [queued, running, succeeded, no_data, failed, cancelled] }
        attempt: { type: integer, minimum: 1 }
        progressCount: { type: integer, format: int64, minimum: 0 }
        heartbeatAt: { type: [string, 'null'], format: date-time }
        leaseExpiresAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        error:
          oneOf:
            - $ref: '#/components/schemas/CollectionError'
            - type: 'null'
    CollectionError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    ChatMessage:
      type: object
      required: [id, externalMessageId, authorDisplayName, messageText, publishedAt, offsetMilliseconds, messageType]
      properties:
        id: { type: string, format: uuid }
        externalMessageId: { type: string }
        authorChannelId: { type: [string, 'null'] }
        authorDisplayName: { type: string }
        messageText: { type: string }
        publishedAt: { type: string, format: date-time }
        offsetMilliseconds: { type: integer, format: int64, minimum: 0 }
        messageType: { type: string, enum: [text, paid_message, membership] }
    ChatMessagePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    TranscriptSegment:
      type: object
      required: [id, trackId, languageCode, isAutoGenerated, startOffsetMilliseconds, endOffsetMilliseconds, text]
      properties:
        id: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        languageCode: { type: string }
        isAutoGenerated: { type: boolean }
        startOffsetMilliseconds: { type: integer, format: int64, minimum: 0 }
        endOffsetMilliseconds: { type: integer, format: int64, minimum: 1 }
        text: { type: string, minLength: 1 }
    TranscriptSegmentPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TranscriptSegment' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    TimelineWindow:
      type: object
      required: [fromMilliseconds, toMilliseconds, chatItems, transcriptItems]
      properties:
        fromMilliseconds: { type: integer, format: int64, minimum: 0 }
        toMilliseconds: { type: integer, format: int64, minimum: 1 }
        chatItems:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        transcriptItems:
          type: array
          items: { $ref: '#/components/schemas/TranscriptSegment' }
    StreamSearchResult:
      type: object
      required: [type, id, offsetMilliseconds, text]
      properties:
        type: { type: string, enum: [chat, transcript] }
        id: { type: string, format: uuid }
        offsetMilliseconds: { type: integer, format: int64, minimum: 0 }
        endOffsetMilliseconds: { type: [integer, 'null'], format: int64, minimum: 1 }
        text: { type: string }
        speaker: { type: [string, 'null'] }
        languageCode: { type: [string, 'null'] }
    StreamSearchPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StreamSearchResult' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - INVALID_YOUTUBE_URL
            - YOUTUBE_VIDEO_NOT_FOUND
            - NOT_ENDED_LIVE_STREAM
            - YOUTUBE_ACCESS_DENIED
            - YOUTUBE_QUOTA_EXCEEDED
            - YOUTUBE_TEMPORARILY_UNAVAILABLE
            - STREAM_NOT_FOUND
            - COLLECTION_ALREADY_ACTIVE
            - COLLECTION_JOB_NOT_FOUND
            - COLLECTION_JOB_NOT_RETRYABLE
            - COLLECTION_STEP_NOT_FOUND
            - COLLECTION_STEP_NOT_RETRYABLE
            - CHAT_COLLECTION_NOT_COMPLETED
            - CHAT_REPLAY_UNAVAILABLE
            - CHAT_SOURCE_CHANGED
            - CHAT_SOURCE_TEMPORARILY_UNAVAILABLE
            - TRANSCRIPT_NOT_AVAILABLE
            - TRANSCRIPT_ACCESS_DENIED
            - TRANSCRIPT_SOURCE_CHANGED
            - TRANSCRIPT_TEMPORARILY_UNAVAILABLE
            - TRANSCRIPT_TIMEOUT
            - INVALID_TIME_RANGE
            - INVALID_SEARCH_QUERY
            - INVALID_CURSOR
            - INTERNAL_ERROR
