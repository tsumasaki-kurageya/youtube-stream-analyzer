openapi: 3.1.0
info:
  title: YouTube Data Gateway API
  version: 1.0.0
  description: |
    Internal API used by the Python collection worker to retrieve normalized
    YouTube chat replay and transcript data. The service is private and
    stateless; PostgreSQL remains the system of record.
servers:
  - url: http://youtube-data-gateway:8080
    description: Private service network
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Configuration and provider readiness probe
      security: []
      responses:
        "200":
          description: Gateway is ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /v1/chat-replay/pages:
    get:
      operationId: getChatReplayPage
      summary: Retrieve one normalized chat replay page
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/Continuation"
      responses:
        "200":
          description: Chat replay page, including an empty terminal page
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReplayPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"
  /v1/transcripts/tracks:
    get:
      operationId: listTranscriptTracks
      summary: List normalized transcript tracks
      description: A video with no usable transcript returns 200 with an empty tracks array.
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Available transcript tracks
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptTrackPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"
  /v1/transcripts/segments:
    get:
      operationId: getTranscriptSegmentPage
      summary: Retrieve one normalized transcript segment page
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: trackId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - $ref: "#/components/parameters/Continuation"
      responses:
        "200":
          description: Transcript segment page, including an empty terminal page
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSegmentPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque shared secret
  parameters:
    VideoId:
      name: videoId
      in: query
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{11}$"
    Continuation:
      name: continuation
      in: query
      required: false
      description: Opaque continuation returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 8192
  headers:
    RequestId:
      description: Correlation identifier generated or propagated by the gateway.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    ProblemResponse:
      description: Stable gateway or upstream error
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Optional retry delay in seconds for retryable errors.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/GatewayProblem"
  schemas:
    ProbeResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ChatReplayPage:
      type: object
      additionalProperties: false
      required:
        - messages
        - continuation
      properties:
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ChatMessage"
        continuation:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 8192
            - type: "null"
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - authorChannelId
        - authorName
        - text
        - publishedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 512
        authorChannelId:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"
        authorName:
          type: string
          maxLength: 500
        text:
          type: string
          maxLength: 20000
        publishedAt:
          type: string
          format: date-time
    TranscriptTrackPage:
      type: object
      additionalProperties: false
      required:
        - tracks
      properties:
        tracks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TranscriptTrack"
    TranscriptTrack:
      type: object
      additionalProperties: false
      required:
        - id
        - languageCode
        - displayName
        - isAutoGenerated
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 4096
        languageCode:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          maxLength: 500
        isAutoGenerated:
          type: boolean
    TranscriptSegmentPage:
      type: object
      additionalProperties: false
      required:
        - segments
        - continuation
      properties:
        segments:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        continuation:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 8192
            - type: "null"
    TranscriptSegment:
      type: object
      additionalProperties: false
      required:
        - id
        - startMilliseconds
        - endMilliseconds
        - text
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 512
        startMilliseconds:
          type: integer
          format: int64
          minimum: 0
        endMilliseconds:
          type: integer
          format: int64
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 20000
    GatewayProblem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - retryable
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - GATEWAY_UNAUTHORIZED
            - YOUTUBE_ACCESS_DENIED
            - CHAT_REPLAY_NOT_AVAILABLE
            - TRANSCRIPT_NOT_AVAILABLE
            - SOURCE_NOT_READY
            - YOUTUBE_RATE_LIMITED
            - YOUTUBE_SOURCE_CHANGED
            - YOUTUBE_TEMPORARILY_UNAVAILABLE
            - YOUTUBE_TIMEOUT
            - GATEWAY_NOT_READY
            - INTERNAL_ERROR
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
          maxLength: 128
