services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: youtube_stream_analyzer
      POSTGRES_USER: ysa
      POSTGRES_PASSWORD: ysa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysa -d youtube_stream_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: python:3.12-slim
    working_dir: /workspace/apps/worker
    command: sh -c "pip install -e . && python -m ysa_worker.main"
    environment:
      YSA_DATABASE_URL: postgres://ysa:ysa@postgres:5432/youtube_stream_analyzer?sslmode=disable
      YSA_WORKER_ID: compose-worker
      YSA_WORKER_POLL_INTERVAL_SECONDS: "3"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [worker]
    init: true
    stop_grace_period: 10s

volumes:
  postgres-data:
