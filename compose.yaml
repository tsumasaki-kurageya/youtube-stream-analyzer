services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: youtube_stream_analyzer
      POSTGRES_USER: ysa
      POSTGRES_PASSWORD: ysa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysa -d youtube_stream_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
