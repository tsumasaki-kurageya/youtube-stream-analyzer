name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: youtube_stream_analyzer
          POSTGRES_USER: ysa
          POSTGRES_PASSWORD: ysa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ysa -d youtube_stream_analyzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YSA_DATABASE_URL: postgres://ysa:ysa@localhost:5432/youtube_stream_analyzer?sslmode=disable
      YSA_TEST_DATABASE_URL: postgres://ysa:ysa@localhost:5432/youtube_stream_analyzer?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve API dependencies
        working-directory: apps/api
        run: go mod tidy
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Install worker dependencies
        working-directory: apps/worker
        run: python -m pip install -e '.[dev]'
      - name: Verify worker database connectivity
        working-directory: apps/worker
        run: python -c "from ysa_worker.main import verify_database; import os; verify_database(os.environ['YSA_DATABASE_URL'])"
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        run: make db-migrate
      - name: Run M1 browser journey
        working-directory: apps/web
        run: npm run test:e2e
      - name: Validate repository and application foundations
        run: make check
      - name: Verify migration rollback and reapply
        run: |
          make db-rollback
          make db-migrate
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
